[workspace]
members = ["app"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["lib", "launch", "logger"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["rt"] }
